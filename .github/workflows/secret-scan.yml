name: Secret Scanning

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write  # can be "read" with GITLEAKS_ENABLE_COMMENTS: "false" ( ==> result in GH actions only )

jobs:
  gitleaks:
    name: Scan repository for secrets
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks needs the Git history, not only the latest commit.
          fetch-depth: 0

          # Do not leave the GitHub token in the local Git configuration.
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Required when the repository belongs to a GitHub organization.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
