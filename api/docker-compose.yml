services:
  mongo:
    image: mongo:7
    container_name: api-mongo-1
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    networks:
      - dbnet

  redis:
    image: redis:7
    container_name: api-redis-1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    networks:
      - dbnet

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: api-worker
    container_name: api-worker-1
    restart: unless-stopped
    working_dir: /app
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MONGO_URI: mongodb://mongo:27017/distriage
      MONGO_DB: distriage
      APP_NAME: DisTriage API
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    networks:
      - appnet
      - dbnet

  flower:
    image: mher/flower:2.0.1
    container_name: api-flower-1
    restart: unless-stopped
    environment:
      FLOWER_PORT: "5555"
      CELERY_BROKER_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:5556:5555"
    depends_on:
      redis:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - appnet
      - dbnet

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: api-api
    container_name: api-api-1
    restart: unless-stopped
    environment:
      APP_NAME: DisTriage API
      API_PREFIX: /api/v1
      MONGO_URI: mongodb://mongo:27017/distriage
      MONGO_DB: distriage
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - appnet
      - dbnet

volumes:
  mongo_data:

networks:
  frontend:
  appnet:
  dbnet:
