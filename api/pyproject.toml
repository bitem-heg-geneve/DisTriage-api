[project]
name = "distriage-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "beanie==2.0.0",
    "motor==3.7.1",
    "pydantic==2.13.4",
    "starlette==1.6.0",
    "aiohttp==3.14.3",
    "requests==2.34.2",
    "msgpack==1.2.1",
    "python-dateutil==2.9.0.post0",
    "kombu==5.6.2",
    "celery[redis]==5.6.3",
    "protobuf>=7.35.1,<8",
]

[dependency-groups]
api = [
    "watchfiles>=1.2.0",
]
worker = [
    "transformers==5.15.0",
    "torch==2.13.0+cpu",
]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    'pytest>=8.4.0',
    'pytest-asyncio>=1.0.0',
    'httpx>=0.28.1',
]
