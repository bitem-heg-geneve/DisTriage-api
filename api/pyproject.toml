[project]
name = "distriage-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.162.1",
    "uvicorn==0.54.0",
    "beanie==2.0.0",
    "motor==3.7.1",
    "pydantic==2.14.3",
    "starlette==1.10.0",
    "aiohttp==3.14.5",
    "requests==2.34.2",
    "msgpack==1.2.4",
    "python-dateutil==4.0.0",
    "kombu==5.7.0",
    "celery[redis]==5.7.0",
    "protobuf>=7.36.2,<8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "httpx>=0.28.1",
]
api = [
    "watchfiles>=1.3.0",
]
worker = [
    "transformers==5.22.2",
    "torch==2.15.0",
]

[tool.uv]
default-groups = []

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }